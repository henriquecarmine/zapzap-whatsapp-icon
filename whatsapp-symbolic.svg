<?xml version="1.0" encoding="utf-8"?>
<!--
  WhatsApp mark, monochrome, for a system tray at small sizes.

  Filled bubble with the handset KNOCKED OUT (fill-rule evenodd) rather than
  an outlined bubble with a filled handset: at 22 px an outline plus an inner
  figure turns to mush, while a solid silhouette with a hole keeps its shape.

  Single colour, no gradients — the tray tints it with the panel's text
  colour, the same way every other symbolic icon works.
-->
